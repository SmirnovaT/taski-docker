server {
  listen 80;

  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_pass $backend_upstream;
  }
  
  location /admin/ {
    set $backend_upstream http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_pass $backend_upstream;
  }

  location /static/ {
    alias /staticfiles/;
  }

  location / {
    root /staticfiles;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }
}
