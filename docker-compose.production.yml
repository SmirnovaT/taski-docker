volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: smirnovatanya/taski_backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
  frontend:
    image: smirnovatanya/taski_frontend
    env_file: .env
    command: sh -c "cp -r /app/build/static/. /frontend_static/ && cp /app/build/index.html /frontend_static/"
    volumes:
      - static_volume:/frontend_static
  gateway:
    image: smirnovatanya/taski_gateway
    env_file: .env
    volumes:
      - static_volume:/staticfiles/
    ports:
      - 8000:80